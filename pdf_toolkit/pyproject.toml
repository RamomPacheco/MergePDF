[project]
name = "pdf-toolkit"
version = "1.0.0"
description = "PDF manipulation toolkit with CLI and desktop UI"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=4.0",
    "pdfplumber>=0.10",
    "pymupdf>=1.24",
    "pdf2docx>=0.5",
    "python-docx>=1.1",
    "reportlab>=4.0",
    "docx2pdf>=0.1",
    "pywin32>=306",
    "PySide6>=6.6",
]

[project.scripts]
pdf-toolkit-ui = "main_ui:main"
